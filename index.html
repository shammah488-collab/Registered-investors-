<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diversity Stock & Bonds Portfolio — Investor Access</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B1220;
    --surface:#0F1830;
    --line:#25314f;
    --slate:#8CA0BE;
    --slate-dim:#5C6E8F;
    --paper:#EDEFF4;
    --brass:#C9A96A;
    --green:#4FAE8C;
    --amber:#E0A458;
    --red:#D96C6C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:'Inter',sans-serif;min-height:100vh;
  }
  /* ---- Gate ---- */
  #gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .gate-card{
    width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:32px 28px;text-align:center;
  }
  .gate-card h1{
    font-family:'Newsreader',serif;font-weight:500;font-size:19px;margin:0 0 6px;
  }
  .gate-card p{color:var(--slate);font-size:12.5px;margin:0 0 22px;}
  .gate-card input{
    width:100%;background:var(--ink);border:1px solid var(--line);border-radius:7px;
    padding:11px 13px;color:var(--paper);font-size:15px;text-align:center;
    letter-spacing:.1em;margin-bottom:12px;
  }
  .gate-card input:focus{outline:none;border-color:var(--brass);}
  .gate-card button{
    width:100%;background:var(--brass);color:var(--ink);border:none;border-radius:7px;
    padding:11px;font-weight:600;font-size:14px;cursor:pointer;
  }
  .gate-error{color:var(--red);font-size:12px;margin-top:10px;min-height:14px;}

  /* ---- List page ---- */
  #list-page{display:none;max-width:520px;margin:0 auto;padding:40px 20px 60px;}
  #list-page.visible{display:block;}
  .list-head{margin-bottom:26px;}
  .list-head h1{font-family:'Newsreader',serif;font-weight:500;font-size:22px;margin:0 0 4px;}
  .list-head p{color:var(--slate-dim);font-size:12.5px;margin:0;}
  .investor-row{
    display:flex;align-items:center;gap:12px;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--line);
  }
  .investor-num{
    font-family:'Inter',sans-serif;font-size:12px;color:var(--slate-dim);
    width:26px;flex-shrink:0;text-align:right;
  }
  .investor-name-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
  .investor-name{font-size:14.5px;}
  .investor-meta{font-size:12px;color:var(--slate-dim);text-align:right;}
  .seal{display:inline-flex;align-items:center;gap:6px;}
  .seal-dot{width:7px;height:7px;border-radius:50%;}
  .seal-dot.active{background:var(--green);}
  .seal-dot.pending{background:var(--amber);}
  .list-foot{margin-top:20px;font-size:11.5px;color:var(--slate-dim);text-align:center;}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>Diversity Stock & Bonds Portfolio</h1>
    <p>Enter access code to view registered investors</p>
    <input id="code-input" type="text" placeholder="Access code" autocomplete="off">
    <button id="gate-btn">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="list-page">
  <div class="list-head">
    <h1>Diversity Stock and Bonds Portfolio Investors Names</h1>
    <p id="count-line"></p>
  </div>
  <div id="investor-list"></div>
</div>

<script>

];

function seededRand(seed){ let s=seed; return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
const rnd = seededRand(7);
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul"];
function genDate(){
  const day = String(Math.floor(1+rnd()*28)).padStart(2,'0');
  const month = MONTHS[Math.floor(rnd()*MONTHS.length)];
  return `${day} ${month} 2026`;
}
function genStatus(){ return rnd() < 0.82 ? "Active" : "Pending"; }

const INVESTORS = NAMES.map(name => ({
  name,
  status: genStatus(),
  registered: genDate(),
}));

document.getElementById('gate-btn').addEventListener('click', tryEnter);
document.getElementById('code-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') tryEnter();
});

function tryEnter(){
  const val = document.getElementById('code-input').value.trim();
  if(val === ACCESS_CODE){
    document.getElementById('gate').style.display='none';
    const page = document.getElementById('list-page');
    page.classList.add('visible');
    renderList();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect code, try again.';
  }
}

function renderList(){
  document.getElementById('count-line').textContent = INVESTORS.length + ' investors on record';
  const wrap = document.getElementById('investor-list');
  wrap.innerHTML = INVESTORS.map((inv, idx) => `
    <div class="investor-row">
      <div class="investor-name-wrap">
        <div class="investor-num">${idx+1}.</div>
        <div class="investor-name">${inv.name}</div>
      </div>
      <div class="investor-meta">
        <div class="seal"><span class="seal-dot ${inv.status.toLowerCase()}"></span>${inv.status}</div>
      </div>
    </div>
  `).join('');
}
</script>
</body>
</html>
